<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sarah Macintosh Design</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Navbar will be injected here -->
    <div id="nav-placeholder"></div>

    <main class="hero">
        <div class="hero-text">
            <h1>Hey, I'm Sarah!</h1>
            <p>Product designer and UX researcher passionate about health and public service.</p>
        </div>

        <img src="assets/sarah-castle-big-rock-blob.png" alt="Sarah portrait" class="hero-image">
    </main>

    <footer class="footer">
        <p>&copy; Sarah Macintosh 2026. All rights reserved.</p>
    </footer>

    <script>
    fetch("nav.html")
        .then(res => res.text())
        .then(data => {
            document.getElementById("nav-placeholder").innerHTML = data;

            const links = document.querySelectorAll(".nav-menu a");
            let currentPage = window.location.pathname.split("/").pop();

            // Fix for homepage (empty = index.html)
            if (currentPage === "") {
                currentPage = "index.html";
            }

            links.forEach(link => {
                if (link.getAttribute("href") === currentPage) {
                    link.classList.add("active");
                }
            });
        });
</script>

</body>
</html>
